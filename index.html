<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAPAZ — Три в ряд</title>
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #030716;
            --bg-surface: #060a19;
            --brand-blue: #070b1b;
            --panel: #080d20;
            --gold: #d4a04c;
            --gold-light: #f2cb72;
            --gold-deep: #8e5b12;
            --gold-grad: linear-gradient(180deg, #efca75 0%, #d49a38 48%, #9d6419 100%);
            --line-gold: rgba(212, 160, 76, 0.55);
            --text: #f4e4bf;
            --text-dim: rgba(244, 228, 191, 0.55);
            --text-bright: #f2cb72;
            --heart: #d4a04c;
            --font-display: Georgia, 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030716 !important;
            font-family: var(--font-ui);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 18%, rgba(48,42,90,.18), transparent 35%),
                        radial-gradient(circle at 50% 75%, rgba(155,94,16,.07), transparent 38%), #030716 !important;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            padding: calc(8px + env(safe-area-inset-top)) 14px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #030716 0%, #050918 100%);
        }

        .btn {
            font-family: var(--font-display);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.97); }
        .btn-gold { background: var(--gold-grad); color: #1a1209; width: 100%; }
        .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--line-gold); width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .toast {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 15px);
            background: #111528;
            border: 1px solid var(--line-gold);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 100;
            text-align: center;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* Меню */
        .main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            gap: 8px;
            overflow: hidden;
        }

        .lives-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 44px;
        }

        .lives-pill .heart {
            width: 34px;
            height: 34px;
            color: var(--gold);
        }

        .lives-pill .heart svg path { fill: currentColor; }
        .lives-pill .heart.empty svg path { fill: none; stroke: var(--gold); stroke-width: 1.5; }

        .menu-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            height: 110px;
            justify-content: center;
        }

        .logo-word {
            font-family: var(--font-display);
            font-size: 42px;
            letter-spacing: 0.25em;
            padding-left: 0.25em;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .logo-line { width: 160px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .logo-sub { font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; }

        .hero-perfume {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-perfume svg, .hero-perfume img {
            height: min(24vh, 200px);
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.8));
        }

        .btn-play {
            width: 100%;
            max-width: 380px;
            min-height: 56px;
            background: var(--gold-grad);
            color: #1a1209;
            font-size: 20px;
            letter-spacing: 0.12em;
        }

        .menu-row {
            width: 100%;
            max-width: 380px;
        }

        .menu-secondary {
            width: 100%;
            min-height: 48px;
            background: rgba(8, 13, 32, 0.7);
            border: 1px solid var(--line-gold);
            color: var(--gold);
            font-size: 13px;
            letter-spacing: 0.1em;
        }

        .main-nav {
            width: calc(100% + 28px);
            margin: auto -14px 0 -14px;
            height: 64px;
            background: #060a19;
            border-top: 1px solid rgba(212, 160, 76, 0.25);
            display: flex;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: #b18b49;
            cursor: pointer;
        }

        .nav-item svg { width: 22px; height: 22px; }
        .nav-item .nav-label { font-size: 8px; letter-spacing: 0.08em; }
        .nav-item.active { color: #f2cb72; }

        /* Экран уровней */
        .levels-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .levels-header {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--line-gold);
            color: var(--gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .levels-title {
            font-family: var(--font-display);
            font-size: 22px;
            color: var(--gold);
            letter-spacing: 0.08em;
        }

        .levels-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 12px;
            background: rgba(5, 9, 23, 0.72);
            border-radius: 10px;
            align-content: start;
        }

        .level-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            background: #111426;
            border: 1px solid rgba(212, 160, 76, 0.4);
            color: #d9b66b;
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-btn.completed { background: var(--gold-grad); color: #1a1209; }
        .level-btn.current { border-color: #f2cb72; box-shadow: 0 0 12px rgba(212, 160, 76, 0.4); }
        .level-btn.locked { opacity: 0.4; cursor: not-allowed; }

        /* Игровой экран */
        .game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .hud {
            height: 60px;
            display: grid;
            grid-template-columns: 42px 1fr auto;
            grid-template-areas: 'back level goal' 'moves score goal';
            gap: 2px 8px;
            align-items: center;
            margin-bottom: 6px;
        }

        .hud-back { grid-area: back; width: 38px; height: 38px; }
        .hud-level { grid-area: level; font-family: var(--font-display); font-size: 15px; color: var(--gold); }
        .hud-chip {
            background: rgba(7, 11, 27, 0.9);
            border: 1px solid var(--line-gold);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .hud-chip.moves { grid-area: moves; justify-self: start; }
        .hud-chip.score { grid-area: score; justify-self: center; }
        .hud-lives { grid-area: goal; justify-self: end; color: var(--gold); display: flex; align-items: center; gap: 4px; }
        .hud-lives svg { width: 20px; height: 20px; fill: var(--gold); }

        .task-container {
            min-height: 52px;
            background: rgba(7, 11, 27, 0.94);
            border: 1px solid var(--line-gold);
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .task-text { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
        .task-progress { font-family: var(--font-display); font-size: 18px; color: var(--text-bright); font-weight: bold; }
        .progress-bar { width: 100%; height: 5px; background: #15182b; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: var(--gold-grad); transition: width 0.3s ease; }

        .board-container {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            width: min(100%, calc(100dvh - 210px));
            max-width: 480px;
            aspect-ratio: 1;
            padding: 6px;
            background: rgba(2, 5, 14, 0.8);
            border: 1px solid rgba(212, 160, 76, 0.2);
            border-radius: 8px;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 5px;
            background: linear-gradient(145deg, #0d1226, #060916);
            border: 1px solid rgba(212, 160, 76, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
        }

        .cell svg, .cell img { width: 84%; height: 84%; pointer-events: none; }
        .cell.selected { border-color: #f2cb72; box-shadow: 0 0 14px rgba(242, 203, 114, 0.8); }
        .cell.box { background: rgba(138, 106, 46, 0.6); border-color: #a8823a; }
        .cell.bomb { background: radial-gradient(circle, #ff4444 0%, #aa0000 100%); }
        .cell.rainbow { background: linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #0000ff); }
        .cell.rocket { background: radial-gradient(circle, var(--gold) 0%, #111426 80%); }
        
        .cell.iced { background: rgba(120, 140, 200, 0.4); border-color: rgba(255, 255, 255, 0.6); }
        .ice-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .ice-overlay svg { width: 70%; height: 70%; opacity: 0.85; }

        /* Анимации */
        @keyframes cellPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); }
            100% { transform: scale(0.2); opacity: 0; }
        }

        @keyframes cellShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .cell.anim-pop { animation: cellPop 220ms ease-in-out forwards; }
        .cell.anim-shake { animation: cellShake 220ms ease-in-out; }

        /* Оверлеи */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 22, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 50;
        }

        .overlay-panel {
            background: linear-gradient(180deg, #0e1428, #050817);
            border: 1px solid var(--line-gold);
            border-radius: 10px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .overlay-title {
            font-family: var(--font-display);
            font-size: 22px;
            color: var(--gold-light);
            letter-spacing: 0.1em;
        }

        .fail-hearts { display: flex; justify-content: center; gap: 8px; }
        .fail-hearts .heart { width: 30px; height: 30px; color: var(--gold); }
        .fail-hearts .heart svg path { fill: currentColor; }
        .fail-hearts .heart.empty svg path { fill: none; stroke: var(--gold); stroke-width: 1.5; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Главное меню -->
        <div class="main-menu" id="mainMenu">
            <div class="lives-pill">
                <span class="heart" id="heart1"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
                <span class="heart" id="heart2"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
                <span class="heart" id="heart3"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
            </div>

            <div class="menu-logo">
                <div class="logo-word">TAPAZ</div>
                <div class="logo-line"></div>
                <div class="logo-sub">Три в ряд</div>
            </div>

            <div class="hero-perfume">
                <svg viewBox="0 0 100 130" fill="none">
                    <rect x="35" y="10" width="30" height="15" rx="3" fill="url(#goldGrad)" stroke="#f2cb72" stroke-width="1.5"/>
                    <rect x="15" y="30" width="70" height="90" rx="8" fill="#111730" stroke="#d4a04c" stroke-width="2"/>
                    <rect x="25" y="45" width="50" height="50" rx="4" fill="rgba(212,160,76,0.1)" stroke="#d4a04c" stroke-width="1"/>
                    <text x="50" y="77" font-family="Georgia,serif" font-size="20" fill="#f2cb72" text-anchor="middle" font-weight="bold">T</text>
                    <defs>
                        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#f2cb72"/>
                            <stop offset="100%" stop-color="#9d6419"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <button class="btn btn-play" id="playBtn" onclick="showGame(unlockedLevel)">ИГРАТЬ</button>

            <div class="menu-row">
                <button class="btn menu-secondary" onclick="showLevels()">ВЫБОР УРОВНЯ</button>
            </div>

            <div class="main-nav">
                <button class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12 L12 3 L21 12"/><rect x="5" y="12" width="14" height="9" rx="1"/></svg>
                    <span class="nav-label">ГЛАВНАЯ</span>
                </button>
                <button class="nav-item" onclick="showToast('Раздел появится скоро')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/></svg>
                    <span class="nav-label">РЕЙТИНГ</span>
                </button>
                <button class="nav-item" onclick="showToast('Раздел появится скоро')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20 C4 16 7.5 14 12 14 C16.5 14 20 16 20 20"/></svg>
                    <span class="nav-label">ПРОФИЛЬ</span>
                </button>
            </div>
        </div>

        <!-- Экран выбора уровней -->
        <div class="levels-screen" id="levelsScreen">
            <div class="levels-header">
                <button class="icon-btn" onclick="showMainMenu()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div class="levels-title">УРОВНИ</div>
                <div style="width: 40px;"></div>
            </div>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>

        <!-- Игровой процесс -->
        <div class="game-screen" id="gameScreen">
            <div class="hud">
                <button class="icon-btn hud-back" onclick="showLevels()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div class="hud-level">УРОВЕНЬ <span id="currentLevel">1</span></div>
                <div class="hud-chip moves">ХОДЫ: <b id="movesLeft">20</b></div>
                <div class="hud-chip score">СЧЕТ: <b id="currentScore">0</b></div>
                <div class="hud-lives">
                    <svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg>
                    <span id="livesInGame">3</span>
                </div>
            </div>

            <div class="task-container">
                <div class="task-text" id="taskText">Задание:</div>
                <div class="task-progress" id="taskProgress">0/0</div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>

            <div class="board-container">
                <div class="board" id="gameBoard"></div>
            </div>

            <!-- Победа -->
            <div class="overlay" id="levelCompleteOverlay">
                <div class="overlay-panel">
                    <div class="overlay-title">УРОВЕНЬ ПРОЙДЕН</div>
                    <div id="completeScore" style="font-size: 16px;">Счёт: 0</div>
                    <button class="btn btn-gold" id="nextLevelBtn">СЛЕДУЮЩИЙ</button>
                    <button class="btn btn-outline" id="completeMenuBtn">В МЕНЮ</button>
                </div>
            </div>

            <!-- Поражение -->
            <div class="overlay" id="levelFailedOverlay">
                <div class="overlay-panel">
                    <div class="overlay-title">НЕ УДАЛОСЬ</div>
                    <div class="fail-hearts">
                        <span class="heart" id="failHeart1"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
                        <span class="heart" id="failHeart2"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
                        <span class="heart" id="failHeart3"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16.5, 3 13, 3 8.5 C3 5.5, 5.5 3, 8 3 C9.5 3, 11 4, 12 5.5 C13 4, 14.5 3, 16 3 C18.5 3, 21 5.5, 21 8.5 C21 13, 17 16.5, 12 21Z"/></svg></span>
                    </div>
                    <div id="failText" style="font-size: 13px; color: var(--text-dim);">Осталось жизней: 2</div>
                    <button class="btn btn-gold" id="retryLevelBtn">ПОВТОРИТЬ</button>
                    <button class="btn btn-outline" id="failMenuBtn">В МЕНЮ</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                if (window.Telegram.WebApp.disableVerticalSwipes) {
                    window.Telegram.WebApp.disableVerticalSwipes();
                }
            } catch(e) {}
        }

        const BOARD_SIZE = 8;
        const TOTAL_LEVELS = 50;
        const MAX_LIVES = 3;

        // Генерация графики духов
        const ALL_PERFUMES = [
            `<svg viewBox="0 0 24 24" fill="none"><rect x="9.5" y="1" width="5" height="3" rx="1" fill="#f2cb72"/><rect x="6" y="5" width="12" height="18" rx="3" fill="#1b2a4a" stroke="#d4a04c" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">1</text></svg>`,
            `<svg viewBox="0 0 24 24" fill="none"><rect x="10" y="1" width="4" height="3" rx="1" fill="#f2cb72"/><circle cx="12" cy="14" r="9" fill="#4a1525" stroke="#d4a04c" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">2</text></svg>`,
            `<svg viewBox="0 0 24 24" fill="none"><rect x="9.5" y="1" width="5" height="3" rx="1" fill="#e0e0e0"/><polygon points="12,5 20,11 17,22 7,22 4,11" fill="#1b3d2f" stroke="#f2cb72" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">3</text></svg>`,
            `<svg viewBox="0 0 24 24" fill="none"><rect x="10" y="1" width="4" height="3" rx="1" fill="#f2cb72"/><rect x="5" y="5" width="14" height="18" rx="5" fill="#3b2042" stroke="#d4a04c" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">4</text></svg>`,
            `<svg viewBox="0 0 24 24" fill="none"><rect x="9.5" y="1" width="5" height="3" rx="1" fill="#f2cb72"/><rect x="7" y="5" width="10" height="18" rx="2" fill="#422e1b" stroke="#d4a04c" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">5</text></svg>`,
            `<svg viewBox="0 0 24 24" fill="none"><rect x="10" y="1" width="4" height="3" rx="1" fill="#d4a04c"/><ellipse cx="12" cy="14" rx="8" ry="9" fill="#0d1b2a" stroke="#f2cb72" stroke-width="0.8"/><text x="12" y="16" font-size="7" fill="#f2cb72" text-anchor="middle" font-family="Georgia">6</text></svg>`
        ];

        // Специальные тайлы
        const BOMB_SVG = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="#111" stroke="#ff4444" stroke-width="2"/><circle cx="9" cy="9" r="2" fill="#fff"/></svg>`;
        const RAINBOW_SVG = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="3"/></svg>`;
        const ROCKET_SVG = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L17 14 L12 11 L7 14 Z" fill="#d4a04c"/></svg>`;
        const BOX_SVG = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#8a6a2e" stroke="#c9a24d" stroke-width="1.5"/></svg>`;
        const ICE_SVG = `<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="1.5"><path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5"/></svg>`;

        // Состояние
        let board = [];
        let activePerfumes = [...ALL_PERFUMES];
        let selectedCell = null;
        let isProcessing = false;
        let currentLevel = 1;
        let unlockedLevel = 1;
        let currentScore = 0;
        let movesLeft = 20;
        let taskTarget = 15;
        let taskProgress = 0;
        let taskType = 'collect';
        let targetIconIndex = 0;
        let targetBoxes = 0;
        let lives = MAX_LIVES;

        const boxes = new Set();
        const specialCells = new Map();
        const ice = new Map();

        let animShake = null;
        let animPop = new Set();

        function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

        function showToast(text) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 1600);
        }

        // Жизни и сохранения
        function loadSave() {
            try {
                const u = localStorage.getItem('tapaz_unlocked');
                if (u) unlockedLevel = parseInt(u) || 1;
                const l = localStorage.getItem('tapaz_lives');
                if (l !== null) lives = parseInt(l) || MAX_LIVES;
            } catch(e) {}
            updateLivesDisplay();
        }

        function saveGame() {
            try {
                localStorage.setItem('tapaz_unlocked', unlockedLevel.toString());
                localStorage.setItem('tapaz_lives', lives.toString());
            } catch(e) {}
        }

        function updateLivesDisplay() {
            const h = [document.getElementById('heart1'), document.getElementById('heart2'), document.getElementById('heart3')];
            for (let i = 0; i < MAX_LIVES; i++) {
                if (h[i]) h[i].className = i < lives ? 'heart' : 'heart empty';
            }
            const inGame = document.getElementById('livesInGame');
            if (inGame) inGame.textContent = lives;
            const pb = document.getElementById('playBtn');
            if (pb) pb.disabled = lives <= 0;
        }

        // Экраны
        function showMainMenu() {
            document.getElementById('mainMenu').style.display = 'flex';
            document.getElementById('levelsScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            updateLivesDisplay();
        }

        function showLevels() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('levelsScreen').style.display = 'flex';
            document.getElementById('gameScreen').style.display = 'none';
            renderLevelsGrid();
        }

        function showGame(level) {
            if (lives <= 0) {
                showToast('Недостаточно жизней');
                return;
            }

            currentLevel = level;
            currentScore = 0;
            taskProgress = 0;
            movesLeft = Math.max(12, 24 - Math.floor(level * 0.2));
            boxes.clear();
            specialCells.clear();
            ice.clear();

            // Выбор задания
            if (level % 3 === 1) {
                taskType = 'collect';
                taskTarget = 10 + level * 2;
                targetIconIndex = (level - 1) % activePerfumes.length;
            } else if (level % 3 === 2) {
                taskType = 'boxes';
                taskTarget = Math.min(18, 6 + level);
                targetBoxes = taskTarget;
            } else {
                taskType = 'score';
                taskTarget = 600 + level * 100;
            }

            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('levelsScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('levelCompleteOverlay').style.display = 'none';
            document.getElementById('levelFailedOverlay').style.display = 'none';

            initBoard();
            updateUI();
        }

        function renderLevelsGrid() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const b = document.createElement('button');
                b.className = 'level-btn';
                b.textContent = i;
                if (i > unlockedLevel) {
                    b.classList.add('locked');
                    b.onclick = () => showToast('Пройдите предыдущий уровень');
                } else {
                    if (i < unlockedLevel) b.classList.add('completed');
                    if (i === unlockedLevel) b.classList.add('current');
                    b.onclick = () => showGame(i);
                }
                grid.appendChild(b);
            }
        }

        // Логика поля
        function initBoard() {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    board[r][c] = Math.floor(Math.random() * activePerfumes.length);
                }
            }

            // Добавление коробок
            if (taskType === 'boxes') {
                let placed = 0;
                while (placed < targetBoxes) {
                    const r = Math.floor(Math.random() * BOARD_SIZE);
                    const c = Math.floor(Math.random() * BOARD_SIZE);
                    const k = `${r}-${c}`;
                    if (!boxes.has(k)) {
                        boxes.add(k);
                        placed++;
                    }
                }
            }

            // Добавление льда на высоких уровнях
            if (currentLevel > 4) {
                const iceCount = Math.min(10, currentLevel - 2);
                let placed = 0;
                while (placed < iceCount) {
                    const r = Math.floor(Math.random() * BOARD_SIZE);
                    const c = Math.floor(Math.random() * BOARD_SIZE);
                    const k = `${r}-${c}`;
                    if (!boxes.has(k) && !ice.has(k)) {
                        ice.set(k, 1);
                        placed++;
                    }
                }
            }

            // Исключение стартовых троек
            let iterations = 0;
            while (findMatches(false).length > 0 && iterations < 80) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (!isBlocked(r, c)) {
                            board[r][c] = Math.floor(Math.random() * activePerfumes.length);
                        }
                    }
                }
                iterations++;
            }

            selectedCell = null;
            isProcessing = false;
            renderBoard();
        }

        function isBlocked(r, c) {
            const k = `${r}-${c}`;
            return boxes.has(k) || specialCells.has(k) || ice.has(k) || board[r][c] === -1;
        }

        function renderBoard() {
            const bEl = document.getElementById('gameBoard');
            bEl.innerHTML = '';

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const k = `${r}-${c}`;

                    if (boxes.has(k)) {
                        cell.classList.add('box');
                        cell.innerHTML = BOX_SVG;
                    } else if (specialCells.has(k)) {
                        const type = specialCells.get(k);
                        cell.classList.add(type);
                        cell.innerHTML = type === 'bomb' ? BOMB_SVG : (type === 'rocket' ? ROCKET_SVG : RAINBOW_SVG);
                    } else if (ice.has(k)) {
                        cell.classList.add('iced');
                        cell.innerHTML = activePerfumes[board[r][c]] + `<span class="ice-overlay">${ICE_SVG}</span>`;
                    } else if (board[r][c] !== -1) {
                        cell.innerHTML = activePerfumes[board[r][c]];
                    }

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    if (animShake && (animShake.k1 === k || animShake.k2 === k)) {
                        cell.classList.add('anim-shake');
                    }

                    if (animPop.has(k)) {
                        cell.classList.add('anim-pop');
                    }

                    cell.onpointerdown = (e) => {
                        e.preventDefault();
                        handleCellClick(r, c);
                    };

                    bEl.appendChild(cell);
                }
            }

            animShake = null;
            animPop.clear();
        }

        function handleCellClick(r, c) {
            if (isProcessing || movesLeft <= 0) return;

            const k = `${r}-${c}`;
            if (boxes.has(k) || ice.has(k)) return;

            if (!selectedCell) {
                selectedCell = { r, c };
                renderBoard();
                return;
            }

            if (selectedCell.r === r && selectedCell.c === c) {
                selectedCell = null;
                renderBoard();
                return;
            }

            const dist = Math.abs(selectedCell.r - r) + Math.abs(selectedCell.c - c);
            if (dist === 1) {
                const r1 = selectedCell.r;
                const c1 = selectedCell.c;
                selectedCell = null;

                const k1 = `${r1}-${c1}`;
                const k2 = `${r}-${c}`;

                if (specialCells.has(k1) || specialCells.has(k2)) {
                    activateSpecial(r1, c1, r, c);
                } else {
                    swapPerfumes(r1, c1, r, c);
                }
            } else {
                selectedCell = { r, c };
                renderBoard();
            }
        }

        async function swapPerfumes(r1, c1, r2, c2) {
            if (isProcessing) return;
            isProcessing = true;

            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;

            renderBoard();
            await sleep(150);

            const matches = findMatches(true);

            if (matches.length > 0) {
                movesLeft--;
                updateUI();
                await processMatches(matches);
                checkGameState();
            } else {
                // Неуспешный ход: тряска и возврат
                animShake = { k1: `${r1}-${c1}`, k2: `${r2}-${c2}` };
                renderBoard();
                await sleep(220);

                board[r2][c2] = board[r1][c1];
                board[r1][c1] = temp;
                renderBoard();
            }

            isProcessing = false;
            checkGameState();
        }

        function findMatches(createSpecials = true) {
            const matched = [];
            const set = new Set();

            function pushMatch(r, c) {
                const k = `${r}-${c}`;
                if (!set.has(k)) {
                    set.add(k);
                    matched.push([r, c]);
                }
            }

            // Горизонтальные линии
            for (let r = 0; r < BOARD_SIZE; r++) {
                let c = 0;
                while (c < BOARD_SIZE) {
                    if (isBlocked(r, c)) { c++; continue; }
                    let len = 1;
                    while (c + len < BOARD_SIZE && !isBlocked(r, c + len) && board[r][c + len] === board[r][c]) {
                        len++;
                    }
                    if (len >= 3) {
                        for (let k = 0; k < len; k++) pushMatch(r, c + k);
                        if (createSpecials) {
                            if (len === 4) specialCells.set(`${r}-${c + 1}`, 'rocket');
                            if (len >= 5) specialCells.set(`${r}-${c + 2}`, 'rainbow');
                        }
                    }
                    c += len;
                }
            }

            // Вертикальные линии
            for (let c = 0; c < BOARD_SIZE; c++) {
                let r = 0;
                while (r < BOARD_SIZE) {
                    if (isBlocked(r, c)) { r++; continue; }
                    let len = 1;
                    while (r + len < BOARD_SIZE && !isBlocked(r + len, c) && board[r + len][c] === board[r][c]) {
                        len++;
                    }
                    if (len >= 3) {
                        for (let k = 0; k < len; k++) pushMatch(r + k, c);
                        if (createSpecials) {
                            if (len === 4 && !specialCells.has(`${r + 1}-${c}`)) specialCells.set(`${r + 1}-${c}`, 'rocket');
                            if (len >= 5 && !specialCells.has(`${r + 2}-${c}`)) specialCells.set(`${r + 2}-${c}`, 'rainbow');
                        }
                    }
                    r += len;
                }
            }

            return matched;
        }

        async function processMatches(matches) {
            while (matches.length > 0) {
                for (const [r, c] of matches) {
                    animPop.add(`${r}-${c}`);
                }
                renderBoard();
                await sleep(220);

                for (const [r, c] of matches) {
                    // Урон коробкам и льду вокруг
                    const neighbors = [[r-1, c], [r+1, c], [r, c-1], [r, c+1]];
                    for (const [nr, nc] of neighbors) {
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            const nk = `${nr}-${nc}`;
                            if (boxes.has(nk)) {
                                boxes.delete(nk);
                                taskProgress++;
                            } else if (ice.has(nk)) {
                                ice.delete(nk);
                            }
                        }
                    }

                    if (taskType === 'collect' && board[r][c] === targetIconIndex) {
                        taskProgress++;
                    }

                    const k = `${r}-${c}`;
                    if (!specialCells.has(k)) {
                        board[r][c] = -1;
                    }
                }

                currentScore += matches.length * 15;
                updateUI();

                refillBoard();
                renderBoard();
                await sleep(180);

                matches = findMatches(true);
            }
        }

        // Физика гравитации
        function refillBoard() {
            for (let c = 0; c < BOARD_SIZE; c++) {
                let writePos = -1;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    const k = `${r}-${c}`;
                    const isStatic = boxes.has(k) || ice.has(k);

                    if (isStatic) {
                        writePos = -1;
                    } else if (board[r][c] === -1 && !specialCells.has(k)) {
                        if (writePos === -1) writePos = r;
                    } else if (board[r][c] !== -1) {
                        if (writePos !== -1) {
                            board[writePos][c] = board[r][c];
                            board[r][c] = -1;
                            r = writePos;
                            writePos = -1;
                        }
                    }
                }

                // Заполнение сверху
                for (let r = 0; r < BOARD_SIZE; r++) {
                    const k = `${r}-${c}`;
                    if (board[r][c] === -1 && !boxes.has(k) && !ice.has(k) && !specialCells.has(k)) {
                        board[r][c] = Math.floor(Math.random() * activePerfumes.length);
                    }
                }
            }
        }

        async function activateSpecial(r1, c1, r2, c2) {
            isProcessing = true;
            movesLeft--;
            updateUI();

            const k1 = `${r1}-${c1}`;
            const k2 = `${r2}-${c2}`;
            const sKey = specialCells.has(k1) ? k1 : k2;
            const type = specialCells.get(sKey);
            const [sr, sc] = sKey.split('-').map(Number);

            specialCells.delete(sKey);
            board[sr][sc] = -1;

            if (type === 'bomb') {
                for (let r = Math.max(0, sr - 1); r <= Math.min(BOARD_SIZE - 1, sr + 1); r++) {
                    for (let c = Math.max(0, sc - 1); c <= Math.min(BOARD_SIZE - 1, sc + 1); c++) {
                        const k = `${r}-${c}`;
                        if (boxes.has(k)) { boxes.delete(k); taskProgress++; }
                        if (ice.has(k)) ice.delete(k);
                        board[r][c] = -1;
                        animPop.add(k);
                    }
                }
            } else if (type === 'rocket') {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const k = `${sr}-${c}`;
                    if (boxes.has(k)) { boxes.delete(k); taskProgress++; }
                    board[sr][c] = -1;
                    animPop.add(k);
                }
                for (let r = 0; r < BOARD_SIZE; r++) {
                    const k = `${r}-${sc}`;
                    if (boxes.has(k)) { boxes.delete(k); taskProgress++; }
                    board[r][sc] = -1;
                    animPop.add(k);
                }
            } else if (type === 'rainbow') {
                const targetColor = board[r1][c1] !== -1 ? board[r1][c1] : 0;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c] === targetColor && !isBlocked(r, c)) {
                            board[r][c] = -1;
                            animPop.add(`${r}-${c}`);
                        }
                    }
                }
            }

            renderBoard();
            await sleep(220);

            refillBoard();
            renderBoard();
            await sleep(180);

            const matches = findMatches(true);
            if (matches.length > 0) {
                await processMatches(matches);
            }

            isProcessing = false;
            checkGameState();
        }

        function checkGameState() {
            let win = false;
            if (taskType === 'score' && currentScore >= taskTarget) win = true;
            if (taskType !== 'score' && taskProgress >= taskTarget) win = true;

            if (win) {
                setTimeout(showLevelComplete, 300);
            } else if (movesLeft <= 0) {
                setTimeout(showLevelFailed, 300);
            }
        }

        function showLevelComplete() {
            document.getElementById('levelCompleteOverlay').style.display = 'flex';
            document.getElementById('completeScore').textContent = `Счёт: ${currentScore}`;
            if (currentLevel >= unlockedLevel) {
                unlockedLevel = Math.min(TOTAL_LEVELS, currentLevel + 1);
                saveGame();
            }
        }

        function showLevelFailed() {
            lives = Math.max(0, lives - 1);
            saveGame();
            updateLivesDisplay();

            document.getElementById('levelFailedOverlay').style.display = 'flex';
            document.getElementById('failText').textContent = `Осталось жизней: ${lives}`;
            document.getElementById('retryLevelBtn').style.display = lives > 0 ? 'inline-flex' : 'none';

            const fh = [document.getElementById('failHeart1'), document.getElementById('failHeart2'), document.getElementById('failHeart3')];
            for (let i = 0; i < MAX_LIVES; i++) {
                if (fh[i]) fh[i].className = i < lives ? 'heart' : 'heart empty';
            }
        }

        function updateUI() {
            document.getElementById('currentLevel').textContent = currentLevel;
            document.getElementById('currentScore').textContent = currentScore;
            document.getElementById('movesLeft').textContent = movesLeft;

            const tText = document.getElementById('taskText');
            const tProg = document.getElementById('taskProgress');

            if (taskType === 'collect') {
                tText.innerHTML = `Соберите флаконы`;
                tProg.textContent = `${taskProgress}/${taskTarget}`;
            } else if (taskType === 'boxes') {
                tText.innerHTML = `Разбейте коробки`;
                tProg.textContent = `${taskProgress}/${taskTarget}`;
            } else {
                tText.innerHTML = `Наберите очки`;
                tProg.textContent = `${Math.min(currentScore, taskTarget)}/${taskTarget}`;
            }

            const cur = taskType === 'score' ? currentScore : taskProgress;
            const pct = Math.min(100, Math.floor((cur / taskTarget) * 100));
            document.getElementById('progressFill').style.width = `${pct}%`;
        }

        // События кнопок оверлеев
        document.getElementById('nextLevelBtn').onclick = () => {
            document.getElementById('levelCompleteOverlay').style.display = 'none';
            showGame(unlockedLevel);
        };
        document.getElementById('completeMenuBtn').onclick = () => {
            document.getElementById('levelCompleteOverlay').style.display = 'none';
            showMainMenu();
        };
        document.getElementById('retryLevelBtn').onclick = () => {
            document.getElementById('levelFailedOverlay').style.display = 'none';
            showGame(currentLevel);
        };
        document.getElementById('failMenuBtn').onclick = () => {
            document.getElementById('levelFailedOverlay').style.display = 'none';
            showMainMenu();
        };

        // Запуск
        loadSave();
        showMainMenu();
    </script>
</body>
</html>
